name: CI/CD Production Deploy to Hostinger

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos para que GITHUB_TOKEN pueda crear y actualizar la rama de despliegue
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npm --workspace=backend run build
        env:
          DATABASE_URL: "mysql://user:password@localhost:3306/unuraymi"

      - name: 🎨 Build Frontend (Static Export)
        run: npm --workspace=frontend run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: "https://api.unu-raymi.com/api"
          NEXT_PUBLIC_API_ASSETS_URL: "https://api.unu-raymi.com"

      - name: 🛡️ Build Admin (Static Export)
        run: npm --workspace=admin run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: "https://api.unu-raymi.com/api"
          NEXT_PUBLIC_API_ASSETS_URL: "https://api.unu-raymi.com"

      - name: 📦 Assemble Production Distribution (public_html)
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist_production/admin dist_production/api
          
          # 1. Frontend estático colocado en la raíz de public_html
          cp -r frontend/out/* dist_production/
          cp .htaccess dist_production/.htaccess
          
          # 2. Admin estático colocado en subcarpeta admin/
          cp -r admin/out/* dist_production/admin/
          
          # 3. .htaccess para Admin con soporte SPA Next.js
          cat << 'EOF' > dist_production/admin/.htaccess
          DirectoryIndex index.html index.php
          <IfModule mod_rewrite.c>
          RewriteEngine On
          RewriteBase /

          RewriteCond %{HTTP:RSC} 1 [OR]
          RewriteCond %{QUERY_STRING} (^|&)_rsc=
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteCond %{REQUEST_FILENAME}/index.txt -f
          RewriteRule ^(.*)$ $1/index.txt [T=text/plain,L]

          RewriteCond %{HTTP:RSC} 1 [OR]
          RewriteCond %{QUERY_STRING} (^|&)_rsc=
          RewriteCond %{REQUEST_FILENAME}.txt -f
          RewriteRule ^(.*)$ $1.txt [T=text/plain,L]

          RewriteCond %{REQUEST_FILENAME} -f
          RewriteRule ^ - [L]

          RewriteCond %{REQUEST_FILENAME} -d
          RewriteCond %{REQUEST_FILENAME}/index.html -f
          RewriteRule ^(.*)$ $1/index.html [L]

          RewriteCond %{REQUEST_FILENAME}.html -f
          RewriteRule ^(.*)$ $1.html [L]

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          </IfModule>

          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
            AddOutputFilterByType DEFLATE application/javascript application/x-javascript application/json
            AddOutputFilterByType DEFLATE image/svg+xml
          </IfModule>
          EOF

          # 4. Proxy API PHP de respaldo
          if [ -f api/index.php ]; then
            cp api/index.php dist_production/api/index.php
          fi
          if [ -f api/.htaccess ]; then
            cp api/.htaccess dist_production/api/.htaccess
          fi

      - name: 🚀 Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist_production
          force_orphan: true

      - name: 🔔 Trigger Hostinger Auto-Deploy Webhook
        if: github.ref == 'refs/heads/main' && env.DEPLOY_URL != ''
        run: |
          echo "Disparando webhook de despliegue a Hostinger..."
          curl -s -X POST "$DEPLOY_URL" || true
          echo "Webhook disparado."
        env:
          DEPLOY_URL: ${{ secrets.HOSTINGER_WEBHOOK_URL }}

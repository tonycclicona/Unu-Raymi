name: CI Build & Test Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npm --workspace=backend run db:local:generate
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: ⚙️ Build Backend API
        run: npm --workspace=backend run build
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: 🎨 Build Frontend (Static Export)
        run: npm --workspace=frontend run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.unu-raymi.com/api"

      - name: 🛡️ Build Admin (Static Export)
        run: npm --workspace=admin run build
        env:
          NEXT_PUBLIC_API_URL: "https://api.unu-raymi.com/api"
